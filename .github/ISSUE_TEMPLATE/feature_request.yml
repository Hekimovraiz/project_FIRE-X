name: Feature request
description: Suggest an idea for FIRE-X
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: textarea
    id: data
    attributes:
      label: Related NASA data or investigation (if any)
      placeholder: "e.g. PSI-69 FLEX, LUCI, FM2"
