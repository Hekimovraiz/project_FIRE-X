name: Bug report
description: Something in FIRE-X does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Website / UI, API / backend, AI assistant, Data, Hardware / ESP32, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open /explorer\n2. …"
  - type: textarea
    id: logs
    attributes:
      label: Logs or Serial Monitor output
      description: Remove any Wi-Fi passwords or API keys first.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.12, Chrome 131, ESP32 core 3.x"
